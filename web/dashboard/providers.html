<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTVS Horus — Providers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f19;--surface:#141925;--surface-hover:#1a2030;--border:#1e2636;--text:#e4e7ec;--text-dim:#6b7385;--accent:#00d4aa;--sidebar-w:220px;--header-h:56px;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;z-index:100}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-brand svg{width:28px;height:28px}
.sidebar-brand span{font-size:16px;font-weight:700}
.sidebar-brand span::after{content:'Security';color:var(--accent);font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:500;border-radius:6px;transition:all .15s}
.nav a:hover{background:var(--surface-hover);color:var(--text)}
.nav a.active{background:rgba(0,212,170,.1);color:var(--accent)}
.nav a svg{width:18px;height:18px;flex-shrink:0}
.nav-section{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);padding:16px 12px 6px}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer}
.user:hover{background:var(--surface-hover)}
.avatar{width:32px;height:32px;background:var(--accent);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--bg)}
.user-info{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--text-dim)}
.main{margin-left:var(--sidebar-w);min-height:100vh}
.header{position:sticky;top:0;height:var(--header-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50}
.header h1{font-size:16px;font-weight:600}
.btn{padding:10px 18px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.content{padding:24px;max-width:1200px}
.providers-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.provider-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.provider-name{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.provider-icon{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.aws{background:#ff9900}
.gcp{background:#4285f4}
.azure{background:#0078d4}
.oci{background:#f80000}
.toggle{position:relative;width:40px;height:22px}
.toggle input{display:none}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}
.status-dot{width:8px;height:8px;border-radius:50%}
.status-dot.connected{background:var(--accent)}
.status-dot.disconnected{background:var(--text-dim)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:6px}
.form-group input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.form-group input::placeholder{color:var(--text-dim)}
.form-group input:focus{border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.provider-actions{display:flex;gap:8px;margin-top:16px}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-danger{background:transparent;color:var(--error);border:1px solid var(--error)}
.btn-danger:hover{background:rgba(239,68,68,.1)}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.main{margin-left:0}.content{padding:16px}.providers-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<script>
    if (!localStorage.getItem('totvs_horus_logged')) {
        window.location.href = '/login';
    }
</script>
<aside class="sidebar">
    <div class="sidebar-brand">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#0099ff"/></linearGradient></defs><circle cx="32" cy="32" r="14" fill="none" stroke="url(#g)" stroke-width="2"/><circle cx="32" cy="32" r="5" fill="url(#g)"/><path d="M32 6 L28 18 L32 16 L36 18 Z" fill="url(#g)" opacity=".7"/><path d="M32 58 L28 46 L32 48 L36 46 Z" fill="url(#g)" opacity=".7"/><path d="M6 32 L18 28 L16 32 L18 36 Z" fill="url(#g)" opacity=".7"/><path d="M58 32 L46 28 L48 32 L46 36 Z" fill="url(#g)" opacity=".7"/></svg>
        <span>TOTVS</span>
    </div>
    <nav class="nav">
        <a href="/dashboard"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>Dashboard</a>
        <a href="/scans"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>Scans</a>
        <a href="/findings"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>Findings</a>
        <a href="/inventory"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>Inventory</a>
        <div class="nav-section">Cloud</div>
        <a href="/providers" class="active"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"/><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"/></svg>Providers</a>
        <a href="/compliance"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L9 9.586 8.707 8.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>Compliance</a>
        <div class="nav-section">Config</div>
        <a href="/settings"><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>Settings</a>
    </nav>
    <div class="sidebar-footer">
        <div class="user"><div class="avatar">LO</div><div class="user-info"><div class="user-name" id="userName">Lorenzo</div><div class="user-role" id="userRole">Admin</div></div></div>
    </div>
</aside>
<main class="main">
    <header class="header"><h1>Providers</h1><button class="btn btn-primary" onclick="window.location.href='/settings'">+ Adicionar</button></header>
    <div class="content">
        <div class="providers-grid">
            <div class="provider-card">
                <div class="provider-header">
                    <div class="provider-name"><div class="provider-icon aws">A</div>AWS</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <span class="status-dot disconnected"></span>
                        <label class="toggle"><input type="checkbox" checked><span class="toggle-slider"></span></label>
                    </div>
                </div>
                <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Regions: us-east-1, sa-saopaulo-1</p>
                <div class="provider-actions">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='/settings'">Configurar</button>
                    <button class="btn btn-danger btn-sm">Remover</button>
                </div>
            </div>
            <div class="provider-card">
                <div class="provider-header">
                    <div class="provider-name"><div class="provider-icon gcp">G</div>GCP</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <span class="status-dot disconnected"></span>
                        <label class="toggle"><input type="checkbox"><span class="toggle-slider"></span></label>
                    </div>
                </div>
                <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Nenhum project configurado</p>
                <div class="provider-actions">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='/settings'">Configurar</button>
                    <button class="btn btn-danger btn-sm">Remover</button>
                </div>
            </div>
            <div class="provider-card">
                <div class="provider-header">
                    <div class="provider-name"><div class="provider-icon azure">Az</div>Azure</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <span class="status-dot disconnected"></span>
                        <label class="toggle"><input type="checkbox"><span class="toggle-slider"></span></label>
                    </div>
                </div>
                <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Nenhuma subscription configurada</p>
                <div class="provider-actions">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='/settings'">Configurar</button>
                    <button class="btn btn-danger btn-sm">Remover</button>
                </div>
            </div>
            <div class="provider-card">
                <div class="provider-header">
                    <div class="provider-name"><div class="provider-icon oci">O</div>OCI</div>
                    <div style="display:flex;align-items:center;gap:8px">
                        <span class="status-dot disconnected"></span>
                        <label class="toggle"><input type="checkbox"><span class="toggle-slider"></span></label>
                    </div>
                </div>
                <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">Nenhum tenancy configurado</p>
                <div class="provider-actions">
                    <button class="btn btn-secondary btn-sm" onclick="window.location.href='/settings'">Configurar</button>
                    <button class="btn btn-danger btn-sm">Remover</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const role = localStorage.getItem('totvs_horus_role') || 'Admin';
    const name = localStorage.getItem('totvs_horus_name') || 'Lorenzo';
    document.getElementById('userName').textContent = name;
    document.getElementById('userRole').textContent = role;
    
    document.querySelector('.user').style.cursor = 'pointer';
    document.querySelector('.user').addEventListener('click', () => {
        if (confirm('Deseja sair?')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    });
</script>
</body>
</html>

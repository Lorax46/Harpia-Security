<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpia Security — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <!-- Painel esquerdo — branding -->
        <div class="brand-panel">
            <div class="brand-content">
                <div class="logo">
                    <svg viewBox="0 0 64 64" class="logo-icon" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="harpia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00d4aa"/>
                                <stop offset="100%" style="stop-color:#0099ff"/>
                            </linearGradient>
                        </defs>
                        <!-- Olho estilizado de águia -->
                        <circle cx="32" cy="32" r="28" fill="none" stroke="url(#harpia-grad)" stroke-width="2" opacity="0.3"/>
                        <circle cx="32" cy="32" r="14" fill="none" stroke="url(#harpia-grad)" stroke-width="2"/>
                        <circle cx="32" cy="32" r="5" fill="url(#harpia-grad)"/>
                        <!-- Penas estilizadas -->
                        <path d="M32 4 L28 16 L32 14 L36 16 Z" fill="url(#harpia-grad)" opacity="0.8"/>
                        <path d="M32 60 L28 48 L32 50 L36 48 Z" fill="url(#harpia-grad)" opacity="0.8"/>
                        <path d="M4 32 L16 28 L14 32 L16 36 Z" fill="url(#harpia-grad)" opacity="0.8"/>
                        <path d="M60 32 L48 28 L50 32 L48 36 Z" fill="url(#harpia-grad)" opacity="0.8"/>
                    </svg>
                </div>
                <h1 class="brand-name">Harpia<span class="brand-accent">Security</span></h1>
                <p class="brand-tagline">Cloud-Native Application Protection Platform</p>
                
                <div class="features">
                    <div class="feature">
                        <span class="feature-icon">🛡️</span>
                        <span>CSPM &amp; CWPP</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">☁️</span>
                        <span>Multi-Cloud</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🔍</span>
                        <span>Agentless Scan</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">📊</span>
                        <span>Severity Dashboard</span>
                    </div>
                </div>
            </div>
            <div class="brand-footer">
                <span>v0.1.0</span>
                <span class="separator">•</span>
                <span>CNAPP Engine</span>
            </div>
        </div>

        <!-- Painel direito — formulário -->
        <div class="form-panel">
            <div class="form-wrapper">
                <div class="form-header">
                    <h2>Acessar plataforma</h2>
                    <p>Entre com suas credenciais para iniciar o scan</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
                        </div>
                        <span class="error-msg" id="emailError"></span>
                    </div>

                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                                <svg viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-msg" id="passwordError"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="remember" name="remember">
                            <span class="checkmark"></span>
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="#" class="forgot-link">Esqueci a senha</a>
                    </div>

                    <button type="submit" class="btn-login" id="btnLogin">
                        <span class="btn-text">Entrar</span>
                        <span class="btn-loader" hidden>
                            <svg class="spinner" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4"/>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Não tem conta? <a href="#" class="signup-link">Solicitar acesso</a></p>
                </div>

                <div class="security-badge">
                    <svg viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 1l6 3v4c0 3.5-2.5 6.5-6 7.5-3.5-1-6-4-6-7.5V4l6-3z"/>
                    </svg>
                    <span>Conexão segura • TLS 1.3</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de notificação -->
    <div class="toast" id="toast" hidden>
        <span class="toast-icon" id="toastIcon"></span>
        <span class="toast-msg" id="toastMsg"></span>
    </div>

    <script src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpa Security — Cloud Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#f6f8fb] text-[#142033]">
    <div id="app">
        <!-- Sidebar -->
        <aside class="fixed inset-y-0 left-0 z-40 flex w-[252px] flex-col border-r border-[#e3e9f1] bg-white" id="sidebar">
            <div class="flex h-[72px] items-center gap-3 border-b border-[#edf1f5] px-6">
                <div class="flex size-9 items-center justify-center rounded-xl bg-[#162d55] text-white">
                    <i data-lucide="shield-check" class="size-5"></i>
                </div>
                <div>
                    <p class="text-[16px] font-bold">Harpa<span class="text-[#4c7df0]">.</span></p>
                    <p class="text-[10px] font-medium uppercase tracking-[0.16em] text-[#8a96a8]">Cloud Security</p>
                </div>
            </div>
            
            <nav class="flex-1 overflow-y-auto px-3 py-5">
                <p class="px-3 pb-2 text-[10px] font-bold uppercase tracking-[0.14em] text-[#a0aaba]">Visão geral</p>
                <div class="flex flex-col gap-1" id="main-nav"></div>
                
                <p class="px-3 pb-2 pt-7 text-[10px] font-bold uppercase tracking-[0.14em] text-[#a0aaba]">Gerenciar</p>
                <div class="flex flex-col gap-1" id="secondary-nav"></div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="lg:ml-[252px]">
            <header class="sticky top-0 z-30 flex h-[72px] items-center justify-between border-b border-[#e3e9f1] bg-white px-6">
                <h1 class="text-[18px] font-bold" id="page-title">Dashboard</h1>
                <div class="flex items-center gap-3">
                    <button class="rounded-lg p-2 text-[#96a1b2] hover:bg-[#f5f8ff]" onclick="alert('Em breve')">
                        <i data-lucide="search" class="size-4"></i>
                    </button>
                    <button class="rounded-lg p-2 text-[#96a1b2] hover:bg-[#f5f8ff]" onclick="alert('Em breve')">
                        <i data-lucide="bell" class="size-4"></i>
                    </button>
                    <div class="flex size-8 items-center justify-center rounded-lg bg-[#e8efff] text-[11px] font-bold text-[#4c7df0]">AD</div>
                </div>
            </header>
            
            <div class="p-6" id="main-content">
                <!-- Stats Cards -->
                <div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                    <div class="rounded-2xl border border-[#e3e9f1] bg-white p-5">
                        <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#e8efff] text-[#4c7df0]">
                            <i data-lucide="alert-triangle" class="size-5"></i>
                        </div>
                        <p class="text-[12px] font-medium text-[#8b97a8]">Total Findings</p>
                        <p class="text-[24px] font-bold" id="stat-findings">—</p>
                    </div>
                    <div class="rounded-2xl border border-[#e3e9f1] bg-white p-5">
                        <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fef3c7] text-[#f59e0b]">
                            <i data-lucide="alert-octagon" class="size-5"></i>
                        </div>
                        <p class="text-[12px] font-medium text-[#8b97a8]">Críticos</p>
                        <p class="text-[24px] font-bold" id="stat-critical">—</p>
                    </div>
                    <div class="rounded-2xl border border-[#e3e9f1] bg-white p-5">
                        <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fee2e2] text-[#ef4444]">
                            <i data-lucide="shield-alert" class="size-5"></i>
                        </div>
                        <p class="text-[12px] font-medium text-[#8b97a8]">Altos</p>
                        <p class="text-[24px] font-bold" id="stat-high">—</p>
                    </div>
                    <div class="rounded-2xl border border-[#e3e9f1] bg-white p-5">
                        <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#dcfce7] text-[#10b981]">
                            <i data-lucide="check-circle" class="size-5"></i>
                        </div>
                        <p class="text-[12px] font-medium text-[#8b97a8]">Checks Totais</p>
                        <p class="text-[24px] font-bold" id="stat-checks">—</p>
                    </div>
                </div>

                <!-- Findings Table -->
                <div class="rounded-2xl border border-[#e3e9f1] bg-white">
                    <div class="flex items-center justify-between border-b border-[#edf1f5] px-5 py-4">
                        <h2 class="text-[14px] font-semibold">Findings Recentes</h2>
                        <button class="rounded-lg border border-[#e8edf4] px-3 py-1.5 text-[12px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]" onclick="loadFindings()">
                            Atualizar
                        </button>
                    </div>
                    <div class="divide-y divide-[#edf1f5]" id="findings-list">
                        <div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Carregando...</div>
                    </div>
                </div>

                <!-- Inventory -->
                <div class="mt-6 rounded-2xl border border-[#e3e9f1] bg-white">
                    <div class="flex items-center justify-between border-b border-[#edf1f5] px-5 py-4">
                        <h2 class="text-[14px] font-semibold">Cloud Inventory</h2>
                        <button class="rounded-lg border border-[#e8edf4] px-3 py-1.5 text-[12px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]" onclick="loadInventory()">
                            Atualizar
                        </button>
                    </div>
                    <div class="divide-y divide-[#edf1f5]" id="inventory-list">
                        <div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Carregando...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // === API Configuration ===
        const API_BASE = window.location.origin;
        let TOKEN = localStorage.getItem('harpia_token') || 'beta-admin-token';

        async function apiCall(method, path, body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
            
            const res = await fetch(`${API_BASE}${path}`, {
                method,
                headers,
                body: body ? JSON.stringify(body) : null
            });
            return res.json();
        }

        // === Navigation ===
        const navItems = [
            { label: 'Dashboard', icon: 'layout-dashboard', section: 'dashboard' },
            { label: 'Cloud Scanners', icon: 'cloud', section: 'scanners', badge: '3' },
            { label: 'Findings', icon: 'alert-triangle', section: 'findings', badge: '24' },
            { label: 'Cloud Inventory', icon: 'archive', section: 'inventory' },
            { label: 'Kubernetes', icon: 'container', section: 'kubernetes' },
            { label: 'Attack Paths', icon: 'network', section: 'attack-paths', badge: '5' },
        ];
        const secondaryItems = [
            { label: 'Políticas', icon: 'shield-check', section: 'policies' },
            { label: 'Integrações', icon: 'zap', section: 'integrations' },
            { label: 'Configurações', icon: 'settings', section: 'settings' },
        ];

        // === Render ===
        function render() {
            // Render navigation
            const mainNav = document.getElementById('main-nav');
            mainNav.innerHTML = navItems.map(item => `
                <button onclick="showSection('${item.section}')" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]">
                    <i data-lucide="${item.icon}" class="size-4"></i> ${item.label}
                    ${item.badge ? `<span class="ml-auto rounded-full bg-[#e8efff] px-2 py-0.5 text-[10px] font-bold text-[#4c7df0]">${item.badge}</span>` : ''}
                </button>
            `).join('');

            const secondaryNav = document.getElementById('secondary-nav');
            secondaryNav.innerHTML = secondaryItems.map(item => `
                <button onclick="showSection('${item.section}')" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]">
                    <i data-lucide="${item.icon}" class="size-4"></i> ${item.label}
                </button>
            `).join('');

            if (window.lucide) lucide.createIcons();
            loadData();
        }

        function showSection(section) {
            document.getElementById('page-title').textContent = section.charAt(0).toUpperCase() + section.slice(1);
        }

        // === Data Loading ===
        async function loadData() {
            loadStats();
            loadFindings();
            loadInventory();
        }

        async function loadStats() {
            try {
                const stats = await apiCall('GET', '/api/dashboard/stats');
                if (stats.stats) {
                    document.getElementById('stat-findings').textContent = stats.stats.total_findings || 0;
                    document.getElementById('stat-critical').textContent = stats.stats.critical || 0;
                    document.getElementById('stat-high').textContent = stats.stats.high || 0;
                    document.getElementById('stat-checks').textContent = '1,139';
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        async function loadFindings() {
            const list = document.getElementById('findings-list');
            list.innerHTML = '<div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Carregando...</div>';
            
            try {
                const findings = await apiCall('GET', '/api/findings');
                if (findings && findings.length > 0) {
                    list.innerHTML = findings.slice(0, 10).map(f => `
                        <div class="flex items-center gap-4 px-5 py-4 hover:bg-[#f5f8ff]">
                            <div class="flex size-8 items-center justify-center rounded-lg ${f.severity === 'critical' || f.severity === 'high' ? 'bg-[#fee2e2] text-[#ef4444]' : 'bg-[#fef3c7] text-[#f59e0b]'}">
                                <i data-lucide="alert-triangle" class="size-4"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <p class="truncate text-[13px] font-medium">${f.title || f.id || 'Unknown'}</p>
                                <p class="text-[11px] text-[#8b97a8]">${f.provider || 'aws'} · ${f.service || 'unknown'}</p>
                            </div>
                            <span class="rounded-full px-2 py-0.5 text-[10px] font-bold ${f.severity === 'critical' ? 'bg-[#fee2e2] text-[#ef4444]' : f.severity === 'high' ? 'bg-[#fee2e2] text-[#f87171]' : 'bg-[#fef3c7] text-[#f59e0b]'}">${f.severity || 'medium'}</span>
                        </div>
                    `).join('');
                    if (window.lucide) lucide.createIcons();
                } else {
                    list.innerHTML = '<div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Nenhum finding encontrado</div>';
                }
            } catch (e) {
                list.innerHTML = `<div class="px-5 py-8 text-center text-[13px] text-[#ef4444]">Erro ao carregar: ${e.message}</div>`;
            }
        }

        async function loadInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '<div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Carregando...</div>';
            
            try {
                const providers = await apiCall('GET', '/api/inventory-v2/providers');
                if (providers && providers.length > 0) {
                    let html = '';
                    providers.forEach(p => {
                        if (p.tables && p.tables.length > 0) {
                            p.tables.forEach(t => {
                                html += `
                                    <div class="flex items-center gap-4 px-5 py-4 hover:bg-[#f5f8ff]">
                                        <div class="flex size-8 items-center justify-center rounded-lg bg-[#e8efff] text-[#4c7df0]">
                                            <i data-lucide="database" class="size-4"></i>
                                        </div>
                                        <div class="min-w-0 flex-1">
                                            <p class="text-[13px] font-medium">${p.id}.${t}</p>
                                            <p class="text-[11px] text-[#8b97a8]">${p.id.toUpperCase()} · ${t.replace(/_/g, ' ')}</p>
                                        </div>
                                        <button class="rounded-lg border border-[#e8edf4] px-2 py-1 text-[11px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]" onclick="syncInventory('${p.id}')">Sync</button>
                                    </div>
                                `;
                            });
                        }
                    });
                    list.innerHTML = html || '<div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Nenhum inventário configurado</div>';
                    if (window.lucide) lucide.createIcons();
                } else {
                    list.innerHTML = '<div class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Nenhum provider configurado</div>';
                }
            } catch (e) {
                list.innerHTML = `<div class="px-5 py-8 text-center text-[13px] text-[#ef4444]">Erro ao carregar: ${e.message}</div>`;
            }
        }

        async function syncInventory(provider) {
            try {
                await apiCall('POST', `/api/inventory-v2/${provider}/sync`);
                alert(`Sync iniciado para ${provider}`);
                loadInventory();
            } catch (e) {
                alert(`Erro ao sincronizar: ${e.message}`);
            }
        }

        // === Initialize ===
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>

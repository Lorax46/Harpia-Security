<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpia Security — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0f19;
    --surface: #141925;
    --border: #1e2636;
    --text: #e4e7ec;
    --text-dim: #6b7385;
    --accent: #00d4aa;
    --accent-hover: #00b894;
    --error: #ef4444;
    --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 32px;
}

/* Logo */
.logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 32px;
}

.logo svg {
    width: 36px;
    height: 36px;
}

.logo span {
    font-size: 20px;
    font-weight: 700;
}

.logo span::after {
    content: 'Security';
    color: var(--accent);
    font-weight: 400;
}

/* Header */
h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 6px;
}

.subtitle {
    font-size: 13px;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 28px;
}

/* Form */
form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    display: block;
    margin-bottom: 6px;
}

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
}

input::placeholder {
    color: var(--text-dim);
}

input:focus {
    border-color: var(--accent);
}

/* Password wrapper */
.pwd-wrapper {
    position: relative;
}

.pwd-wrapper input {
    padding-right: 42px;
}

.pwd-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    display: flex;
}

.pwd-toggle:hover {
    color: var(--text);
}

.pwd-toggle svg {
    width: 18px;
    height: 18px;
}

/* Options */
.options {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
    cursor: pointer;
}

.remember input {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
}

.forgot {
    color: var(--accent);
    text-decoration: none;
}

.forgot:hover {
    text-decoration: underline;
}

/* Button */
button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: var(--bg);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
}

button[type="submit"]:hover {
    background: var(--accent-hover);
}

button[type="submit"]:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* Footer */
.footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
}

.footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
}

/* Security badge */
.badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: monospace;
}

.badge svg {
    width: 12px;
    height: 12px;
    color: var(--accent);
}

/* Error */
.error {
    font-size: 11px;
    color: var(--error);
    min-height: 14px;
}

input.error-border {
    border-color: var(--error);
}

/* Toast */
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, bottom 0.2s;
}

.toast.show {
    opacity: 1;
    bottom: 32px;
}

.toast.success { border-color: var(--accent); }
.toast.error { border-color: var(--error); }

/* Demo credentials box */
.demo-box {
    margin-top: 20px;
    padding: 12px;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
    font-size: 11px;
}

.demo-box summary {
    cursor: pointer;
    color: var(--text-dim);
    font-weight: 500;
    user-select: none;
}

.demo-box summary:hover {
    color: var(--text);
}

.demo-creds {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.demo-creds code {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--surface);
    border-radius: 4px;
    font-family: monospace;
    font-size: 11px;
    cursor: pointer;
    transition: background 0.15s;
}

.demo-creds code:hover {
    background: var(--surface-hover);
}

.demo-creds code span {
    color: var(--text-dim);
}

/* Responsivo */
@media (max-width: 420px) {
    .card {
        padding: 32px 24px;
    }
    
    .logo svg {
        width: 32px;
        height: 32px;
    }
    
    .logo span {
        font-size: 18px;
    }
}
</style>
</head>
<body>

<div class="card">
    <div class="logo">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00d4aa"/>
                    <stop offset="100%" stop-color="#0099ff"/>
                </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="14" fill="none" stroke="url(#g)" stroke-width="2"/>
            <circle cx="32" cy="32" r="5" fill="url(#g)"/>
            <path d="M32 6 L28 18 L32 16 L36 18 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M32 58 L28 46 L32 48 L36 46 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M6 32 L18 28 L16 32 L18 36 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M58 32 L46 28 L48 32 L46 36 Z" fill="url(#g)" opacity="0.7"/>
        </svg>
        <span>Harpia</span>
    </div>

    <h1>Acessar plataforma</h1>
    <p class="subtitle">Entre com suas credenciais para iniciar</p>

    <form id="form" novalidate>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
            <div class="error" id="emailErr"></div>
        </div>

        <div>
            <label for="password">Senha</label>
            <div class="pwd-wrapper">
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="pwd-toggle" id="toggle" aria-label="Mostrar senha">
                    <svg viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
            <div class="error" id="pwdErr"></div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox" id="remember">
                Lembrar
            </label>
            <a href="#" class="forgot">Esqueci a senha</a>
        </div>

        <button type="submit" id="btn">Entrar</button>
    </form>

    <p class="footer">Sem conta? <a href="#">Solicitar acesso</a></p>

    <div class="badge">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l6 3v4c0 3.5-2.5 6.5-6 7.5-3.5-1-6-4-6-7.5V4l6-3z"/></svg>
        TLS 1.3
    </div>

    <!-- Demo credentials -->
    <details class="demo-box">
        <summary>🔑 Credenciais de teste</summary>
        <div class="demo-creds">
            <code onclick="fillDemo('admin@harpia.security', 'admin123')">
                <span>Admin</span>
                admin@harpia.security / admin123
            </code>
            <code onclick="fillDemo('analista@harpia.security', 'analista123')">
                <span>Analista</span>
                analista@harpia.security / analista123
            </code>
            <code onclick="fillDemo('viewer@harpia.security', 'viewer123')">
                <span>Viewer</span>
                viewer@harpia.security / viewer123
            </code>
        </div>
    </details>
</div>

<div class="toast" id="toast">
    <span id="toastIcon"></span>
    <span id="toastMsg"></span>
</div>

<script>
// Demo credentials (NUNCA usar em produção)
const CREDS = {
    'admin@harpia.security':    { pwd: 'admin123',    role: 'Admin' },
    'analista@harpia.security': { pwd: 'analista123', role: 'Analista' },
    'viewer@harpia.security':   { pwd: 'viewer123',   role: 'Viewer' }
};

const form = document.getElementById('form');
const email = document.getElementById('email');
const pwd = document.getElementById('password');
const toggle = document.getElementById('toggle');
const btn = document.getElementById('btn');
const toast = document.getElementById('toast');

// Toggle senha
toggle.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    toggle.innerHTML = show
        ? '<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"/><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"/></svg>'
        : '<svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>';
});

// Fill demo credentials
function fillDemo(e, p) {
    email.value = e;
    pwd.value = p;
    clear(email);
    clear(pwd);
}

// Validação
function err(el, msg) {
    el.classList.add('error-border');
    document.getElementById(el.id + 'Err').textContent = msg;
}

function clear(el) {
    el.classList.remove('error-border');
    document.getElementById(el.id + 'Err').textContent = '';
}

email.addEventListener('input', () => clear(email));
pwd.addEventListener('input', () => clear(pwd));

// Submit
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let ok = true;

    if (!email.value || !email.value.includes('@')) {
        err(email, 'Email inválido');
        ok = false;
    }
    if (!pwd.value) {
        err(pwd, 'Senha obrigatória');
        ok = false;
    }
    if (!ok) return;

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    await new Promise(r => setTimeout(r, 800));

    const user = CREDS[email.value.toLowerCase()];
    if (user && user.pwd === pwd.value) {
        localStorage.setItem('harpia_logged', 'true');
        localStorage.setItem('harpia_role', user.role);
        showToast(`Bem-vindo, ${user.role}!`, 'success');
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1000);
    } else {
        err(email, 'Credenciais inválidas');
        err(pwd, 'Verifique email e senha');
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
});

// Toast
function showToast(msg, type) {
    toast.className = 'toast show ' + type;
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = type === 'success' ? '✓' : '✕';
    setTimeout(() => toast.className = 'toast', 3000);
}

email.focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harpia Security — Findings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0b0f19;
    --surface: #141925;
    --surface-hover: #1a2030;
    --border: #1e2636;
    --text: #e4e7ec;
    --text-dim: #6b7385;
    --accent: #00d4aa;
    --accent-hover: #00b894;
    --error: #ef4444;
    --warning: #f59e0b;
    --critical: #ef4444;
    --high: #f97316;
    --medium: #eab308;
    --low: #22c55e;
    --info: #3b82f6;
    --sidebar-w: 220px;
    --header-h: 56px;
    --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sidebar-w);
    height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    z-index: 100;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
}

.sidebar-brand svg { width: 28px; height: 28px; }
.sidebar-brand span { font-size: 16px; font-weight: 700; }
.sidebar-brand span::after { content: 'Security'; color: var(--accent); font-weight: 400; }

.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; flex: 1; }

.nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    transition: all 0.15s;
}

.nav a:hover { background: var(--surface-hover); color: var(--text); }
.nav a.active { background: rgba(0, 212, 170, 0.1); color: var(--accent); }
.nav a svg { width: 18px; height: 18px; flex-shrink: 0; }

.nav-section {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    padding: 16px 12px 6px;
}

.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }

.user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.user:hover { background: var(--surface-hover); }

.avatar {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--bg);
}

.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 11px; color: var(--text-dim); }

/* Main */
.main { margin-left: var(--sidebar-w); min-height: 100vh; }

.header {
    position: sticky;
    top: 0;
    height: var(--header-h);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 50;
}

.header h1 { font-size: 16px; font-weight: 600; }

.btn {
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: all 0.15s;
}

.btn-primary { background: var(--accent); color: var(--bg); }
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-hover); }

/* Content */
.content { padding: 24px; max-width: 1200px; }

/* Stats */
.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
}

.stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
}

.stat-card.critical { border-top: 3px solid var(--critical); }
.stat-card.high { border-top: 3px solid var(--high); }
.stat-card.medium { border-top: 3px solid var(--medium); }
.stat-card.low { border-top: 3px solid var(--low); }
.stat-card.info { border-top: 3px solid var(--info); }

.stat-value { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.stat-card.critical .stat-value { color: var(--critical); }
.stat-card.high .stat-value { color: var(--high); }
.stat-card.medium .stat-value { color: var(--medium); }
.stat-card.low .stat-value { color: var(--low); }
.stat-card.info .stat-value { color: var(--info); }

.stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

/* Findings table */
.findings-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}

.findings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.findings-header h3 { font-size: 14px; font-weight: 600; }

.findings-list { max-height: 600px; overflow-y: auto; }

.finding-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
}

.finding-item:last-child { border-bottom: none; }
.finding-item:hover { background: var(--surface-hover); }

.severity-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    white-space: nowrap;
}

.severity-badge.critical { background: rgba(239, 68, 68, 0.2); color: var(--critical); }
.severity-badge.high { background: rgba(249, 115, 22, 0.2); color: var(--high); }
.severity-badge.medium { background: rgba(234, 179, 8, 0.2); color: var(--medium); }
.severity-badge.low { background: rgba(34, 197, 94, 0.2); color: var(--low); }
.severity-badge.informational { background: rgba(59, 130, 246, 0.2); color: var(--info); }

.finding-content { flex: 1; min-width: 0; }

.finding-content h4 { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.finding-content p { font-size: 12px; color: var(--text-dim); }

.finding-meta {
    display: flex;
    gap: 16px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-dim);
}

.finding-meta span { display: flex; align-items: center; gap: 4px; }

/* Empty state */
.empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    color: var(--text-dim);
    text-align: center;
}

.empty svg { width: 56px; height: 56px; margin-bottom: 16px; opacity: 0.4; }
.empty h3 { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
.empty p { font-size: 13px; margin-bottom: 20px; }

/* Responsivo */
@media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .content { padding: 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- Sidebar -->
<script>
    if (!localStorage.getItem('harpia_logged')) {
        window.location.href = '/login';
    }
</script>
<aside class="sidebar">
    <div class="sidebar-brand">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#00d4aa"/><stop offset="100%" stop-color="#0099ff"/></linearGradient></defs>
            <circle cx="32" cy="32" r="14" fill="none" stroke="url(#g)" stroke-width="2"/>
            <circle cx="32" cy="32" r="5" fill="url(#g)"/>
            <path d="M32 6 L28 18 L32 16 L36 18 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M32 58 L28 46 L32 48 L36 46 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M6 32 L18 28 L16 32 L18 36 Z" fill="url(#g)" opacity="0.7"/>
            <path d="M58 32 L46 28 L48 32 L46 36 Z" fill="url(#g)" opacity="0.7"/>
        </svg>
        <span>Harpia</span>
    </div>

    <nav class="nav">
        <a href="/dashboard">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
            Dashboard
        </a>
        <a href="/scans">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            Scans
        </a>
        <a href="/findings" class="active">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>
            Findings
        </a>
        <a href="/inventory">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
            Inventory
        </a>

        <div class="nav-section">Cloud</div>

        <a href="/providers">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"/><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"/></svg>
            Providers
        </a>
        <a href="/compliance">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L9 9.586 8.707 8.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            Compliance
        </a>

        <div class="nav-section">Config</div>

        <a href="/settings">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            Settings
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user">
            <div class="avatar">LO</div>
            <div class="user-info">
                <div class="user-name" id="userName">Lorenzo</div>
                <div class="user-role" id="userRole">Admin</div>
            </div>
        </div>
    </div>
</aside>

<!-- Main -->
<main class="main">
    <header class="header">
        <h1>Findings</h1>
        <button class="btn btn-secondary">Exportar</button>
    </header>

    <div class="content">
        <!-- Stats -->
        <div class="stats">
            <div class="stat-card critical">
                <div class="stat-value">0</div>
                <div class="stat-label">Critical</div>
            </div>
            <div class="stat-card high">
                <div class="stat-value">0</div>
                <div class="stat-label">High</div>
            </div>
            <div class="stat-card medium">
                <div class="stat-value">0</div>
                <div class="stat-label">Medium</div>
            </div>
            <div class="stat-card low">
                <div class="stat-value">0</div>
                <div class="stat-label">Low</div>
            </div>
            <div class="stat-card info">
                <div class="stat-value">0</div>
                <div class="stat-label">Info</div>
            </div>
        </div>

        <!-- Findings table -->
        <div class="findings-table">
            <div class="findings-header">
                <h3>Todos os Findings</h3>
                <span style="font-size:12px;color:var(--text-dim)">0 findings</span>
            </div>
            <div class="empty">
                <svg viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
                <h3>Nenhum finding</h3>
                <p>Execute um scan para encontrar vulnerabilidades e misconfigurações.</p>
                <button class="btn btn-primary" onclick="window.location.href='/scans'">Ir para Scans</button>
            </div>
        </div>
    </div>
</main>


<script>
    const role = localStorage.getItem('harpia_role') || 'Admin';
    const name = localStorage.getItem('harpia_name') || 'Lorenzo';
    document.getElementById('userName').textContent = name;
    document.getElementById('userRole').textContent = role;
    
    document.querySelector('.user').style.cursor = 'pointer';
    document.querySelector('.user').addEventListener('click', () => {
        if (confirm('Deseja sair?')) {
            localStorage.clear();
            window.location.href = '/login';
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#162d55">
    <title>Harpa Security — Findings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 40; opacity: 0; visibility: hidden; transition: all 0.3s;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { transition: transform 0.3s ease; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
        .badge-critical { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-high { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
        .badge-medium { background: #fefce8; color: #ca8a04; border: 1px solid #fde047; }
        .badge-low { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .nav-item.active { background: #eff6ff; color: #4c7df0; font-weight: 600; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; }
            .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
            .provider-tabs { overflow-x: auto; white-space: nowrap; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr !important; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .provider-tab {
            padding: 8px 16px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; border: 1px solid #e8edf4;
            display: flex; align-items: center; gap: 8px;
            background: white; white-space: nowrap;
        }
        .provider-tab:hover { border-color: #4c7df0; background: #f5f8ff; }
        .provider-tab.active { background: #eff6ff; border-color: #4c7df0; color: #4c7df0; font-weight: 600; }
        .finding-row:hover { background: #f5f8ff; }
        .severity-dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        }
        .severity-dot.critical { background: #ef4444; }
        .severity-dot.high { background: #f97316; }
        .severity-dot.medium { background: #eab308; }
        .severity-dot.low { background: #22c55e; }
    </style>
</head>
<body class="min-h-screen bg-[#f6f8fb] text-[#142033]">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <aside class="sidebar fixed inset-y-0 left-0 z-50 flex w-[260px] flex-col border-r border-[#e3e9f1] bg-white" id="sidebar">
        <div class="flex h-[68px] items-center justify-between border-b border-[#edf1f5] px-5">
            <div class="flex items-center gap-3">
                <div class="flex size-9 items-center justify-center rounded-xl bg-[#162d55] text-white">
                    <i data-lucide="shield-check" class="size-5"></i>
                </div>
                <div>
                    <p class="text-[16px] font-bold leading-tight">Harpa<span class="text-[#4c7df0]">.</span></p>
                    <p class="text-[9px] font-medium uppercase tracking-[0.16em] text-[#8a96a8]">Cloud Security</p>
                </div>
            </div>
            <button class="lg:hidden rounded-lg p-1.5 text-[#96a1b2] hover:bg-[#f5f8ff]" onclick="toggleSidebar()">
                <i data-lucide="x" class="size-5"></i>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto px-3 py-4">
            <p class="px-3 pb-2 text-[10px] font-bold uppercase tracking-[0.14em] text-[#a0aaba]">Visão geral</p>
            <div class="flex flex-col gap-0.5" id="main-nav"></div>
            <p class="px-3 pb-2 pt-6 text-[10px] font-bold uppercase tracking-[0.14em] text-[#a0aaba]">Gerenciar</p>
            <div class="flex flex-col gap-0.5" id="secondary-nav"></div>
        </nav>
    </aside>

    <main class="main-content min-h-screen lg:ml-[260px]">
        <header class="sticky top-0 z-30 flex h-[68px] items-center justify-between border-b border-[#e3e9f1] bg-white px-4 lg:px-6">
            <div class="flex items-center gap-3">
                <button class="lg:hidden rounded-lg p-2 text-[#96a1b2] hover:bg-[#f5f8ff]" onclick="toggleSidebar()">
                    <i data-lucide="menu" class="size-5"></i>
                </button>
                <h1 class="text-[16px] lg:text-[18px] font-bold">Findings por Provider</h1>
            </div>
            <div class="flex items-center gap-2">
                <button class="relative rounded-lg p-2 text-[#96a1b2] hover:bg-[#f5f8ff]" onclick="loadFindings()">
                    <i data-lucide="refresh-cw" class="size-4"></i>
                </button>
                <div class="flex size-8 items-center justify-center rounded-lg bg-[#e8efff] text-[11px] font-bold text-[#4c7df0]">AC</div>
            </div>
        </header>

        <div class="p-4 lg:p-6">
            <!-- Stats Cards -->
            <div class="stats-grid mb-6 grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
                <div class="card-hover rounded-2xl border border-[#e3e9f1] bg-white p-4 lg:p-5 transition-all">
                    <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fef2f2] text-[#ef4444]">
                        <i data-lucide="alert-octagon" class="size-5"></i>
                    </div>
                    <p class="text-[11px] lg:text-[12px] font-medium text-[#8b97a8]">Total Findings</p>
                    <p class="text-[20px] lg:text-[24px] font-bold" id="stat-total">—</p>
                </div>
                <div class="card-hover rounded-2xl border border-[#e3e9f1] bg-white p-4 lg:p-5 transition-all">
                    <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fef2f2] text-[#dc2626]">
                        <i data-lucide="alert-triangle" class="size-5"></i>
                    </div>
                    <p class="text-[11px] lg:text-[12px] font-medium text-[#8b97a8]">Críticos</p>
                    <p class="text-[20px] lg:text-[24px] font-bold" id="stat-critical">—</p>
                </div>
                <div class="card-hover rounded-2xl border border-[#e3e9f1] bg-white p-4 lg:p-5 transition-all">
                    <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fff7ed] text-[#f97316]">
                        <i data-lucide="shield-alert" class="size-5"></i>
                    </div>
                    <p class="text-[11px] lg:text-[12px] font-medium text-[#8b97a8]">Altos</p>
                    <p class="text-[20px] lg:text-[24px] font-bold" id="stat-high">—</p>
                </div>
                <div class="card-hover rounded-2xl border border-[#e3e9f1] bg-white p-4 lg:p-5 transition-all">
                    <div class="mb-3 flex size-10 items-center justify-center rounded-xl bg-[#fefce8] text-[#eab308]">
                        <i data-lucide="info" class="size-5"></i>
                    </div>
                    <p class="text-[11px] lg:text-[12px] font-medium text-[#8b97a8]">Médios</p>
                    <p class="text-[20px] lg:text-[24px] font-bold" id="stat-medium">—</p>
                </div>
            </div>

            <!-- Provider Tabs -->
            <div class="mb-6">
                <div class="provider-tabs flex gap-2 pb-2" id="provider-tabs">
                    <!-- Tabs will be rendered here -->
                </div>
            </div>

            <!-- Findings Table -->
            <div class="rounded-2xl border border-[#e3e9f1] bg-white">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-[#edf1f5] px-4 lg:px-5 py-4">
                    <div>
                        <h2 class="text-[14px] font-semibold" id="findings-title">Todos os Providers</h2>
                        <p class="text-[11px] text-[#8b97a8] mt-0.5" id="findings-subtitle">Selecione um provider para filtrar</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <select id="severity-filter" class="rounded-lg border border-[#e8edf4] px-3 py-1.5 text-[12px] text-[#4b5563] bg-white" onchange="filterBySeverity()">
                            <option value="all">Todas severidades</option>
                            <option value="critical">Crítico</option>
                            <option value="high">Alto</option>
                            <option value="medium">Médio</option>
                            <option value="low">Baixo</option>
                        </select>
                        <select id="status-filter" class="rounded-lg border border-[#e8edf4] px-3 py-1.5 text-[12px] text-[#4b5563] bg-white" onchange="filterByStatus()">
                            <option value="all">Todos status</option>
                            <option value="fail">Falha</option>
                            <option value="pass">Passou</option>
                        </select>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-[#edf1f5] text-left">
                                <th class="px-4 lg:px-5 py-3 text-[10px] font-bold uppercase tracking-wider text-[#a0aaba]">Status</th>
                                <th class="px-4 lg:px-5 py-3 text-[10px] font-bold uppercase tracking-wider text-[#a0aaba]">Finding</th>
                                <th class="hidden sm:table-cell px-4 lg:px-5 py-3 text-[10px] font-bold uppercase tracking-wider text-[#a0aaba]">Provider</th>
                                <th class="hidden md:table-cell px-4 lg:px-5 py-3 text-[10px] font-bold uppercase tracking-wider text-[#a0aaba]">Service</th>
                                <th class="px-4 lg:px-5 py-3 text-[10px] font-bold uppercase tracking-wider text-[#a0aaba]">Severidade</th>
                            </tr>
                        </thead>
                        <tbody id="findings-list">
                            <tr><td colspan="5" class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        const TOKEN = localStorage.getItem('harpia_token') || 'beta-admin-token';
        let allFindings = [];
        let currentProvider = 'all';

        async function apiCall(method, path, body = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
            const res = await fetch(`${API_BASE}${path}`, {
                method, headers,
                body: body ? JSON.stringify(body) : null
            });
            return res.json();
        }

        const navItems = [
            { label: 'Dashboard', icon: 'layout-dashboard', section: 'dashboard', href: '/' },
            { label: 'Findings', icon: 'alert-triangle', section: 'findings', href: '/findings' },
            { label: 'Cloud Scanners', icon: 'cloud', section: 'scanners', href: '/api/scans' },
            { label: 'Cloud Inventory', icon: 'archive', section: 'inventory', href: '/api/inventory' },
        ];
        const secondaryItems = [
            { label: 'Políticas', icon: 'shield-check', section: 'policies' },
            { label: 'Configurações', icon: 'settings', section: 'settings' },
        ];

        function render() {
            const mainNav = document.getElementById('main-nav');
            mainNav.innerHTML = navItems.map(item => `
                <button onclick="window.location.href='${item.href || '#'}'" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13px] font-medium text-[#4b5563] hover:bg-[#f5f8ff] ${item.section === 'findings' ? 'active' : ''}">
                    <i data-lucide="${item.icon}" class="size-4"></i> ${item.label}
                </button>
            `).join('');

            const secondaryNav = document.getElementById('secondary-nav');
            secondaryNav.innerHTML = secondaryItems.map(item => `
                <button onclick="window.location.href='#'" class="nav-item flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-[13px] font-medium text-[#4b5563] hover:bg-[#f5f8ff]">
                    <i data-lucide="${item.icon}" class="size-4"></i> ${item.label}
                </button>
            `).join('');

            if (window.lucide) lucide.createIcons();
            loadFindings();
        }

        async function loadFindings() {
            try {
                const stats = await apiCall('GET', '/api/findings-stats');
                document.getElementById('stat-total').textContent = stats.total || 0;
                document.getElementById('stat-critical').textContent = stats.critical || 0;
                document.getElementById('stat-high').textContent = stats.high || 0;
                document.getElementById('stat-medium').textContent = stats.medium || 0;

                // Render provider tabs
                const providers = [
                    { id: 'all', name: 'Todos', icon: '🌐' },
                    { id: 'oci', name: 'OCI', icon: '🔶' },
                    { id: 'aws', name: 'AWS', icon: '☁️' },
                    { id: 'azure', name: 'Azure', icon: '🔷' },
                    { id: 'gcp', name: 'GCP', icon: '🌍' },
                    { id: 'cloudflare', name: 'Cloudflare', icon: '🛡️' },
                ];

                const tabs = document.getElementById('provider-tabs');
                tabs.innerHTML = providers.map(p => `
                    <button onclick="selectProvider('${p.id}')" class="provider-tab ${currentProvider === p.id ? 'active' : ''}">
                        <span>${p.icon}</span>
                        <span>${p.name}</span>
                        ${stats.providers && stats.providers[p.id] ? `<span class="ml-1 rounded-full bg-[#e8efff] px-1.5 py-0.5 text-[10px] font-bold text-[#4c7df0]">${stats.providers[p.id].total || 0}</span>` : ''}
                    </button>
                `).join('');

                if (window.lucide) lucide.createIcons();

                // Load findings
                const findings = await apiCall('GET', '/api/findings-by-provider');
                allFindings = findings;
                renderFindings(findings);
            } catch (e) {
                console.error('Failed to load findings:', e);
                document.getElementById('findings-list').innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-[13px] text-[#ef4444]">Erro ao carregar findings</td></tr>`;
            }
        }

        function selectProvider(provider) {
            currentProvider = provider;
            loadFindings();
        }

        function renderFindings(findingsByProvider) {
            let all = [];
            if (currentProvider === 'all') {
                for (const [provider, findings] of Object.entries(findingsByProvider)) {
                    findings.forEach(f => all.push(f));
                }
            } else if (findingsByProvider[currentProvider]) {
                all = findingsByProvider[currentProvider];
            }

            const list = document.getElementById('findings-list');
            if (all.length === 0) {
                list.innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Nenhum finding encontrado para este provider</td></tr>`;
                return;
            }

            list.innerHTML = all.map(f => `
                <tr class="finding-row border-b border-[#edf1f5] transition-colors">
                    <td class="px-4 lg:px-5 py-3">
                        <span class="flex size-6 items-center justify-center rounded-full ${f.status === 'pass' ? 'bg-[#dcfce7] text-[#22c55e]' : 'bg-[#fee2e2] text-[#ef4444]'}">
                            <i data-lucide="${f.status === 'pass' ? 'check' : 'x'}" class="size-3"></i>
                        </span>
                    </td>
                    <td class="px-4 lg:px-5 py-3">
                        <p class="text-[12px] font-medium text-[#142033] truncate max-w-[250px]" title="${f.title}">${f.title}</p>
                        <p class="text-[10px] text-[#8b97a8]">${f.description ? f.description.substring(0, 60) : ''}...</p>
                    </td>
                    <td class="hidden sm:table-cell px-4 lg:px-5 py-3">
                        <span class="rounded-full bg-[#f1f5f9] px-2 py-0.5 text-[10px] font-medium text-[#475569]">${f.provider}</span>
                    </td>
                    <td class="hidden md:table-cell px-4 lg:px-5 py-3">
                        <span class="text-[11px] text-[#4b5563]">${f.service}</span>
                    </td>
                    <td class="px-4 lg:px-5 py-3">
                        <div class="flex items-center gap-2">
                            <span class="severity-dot ${f.severity}"></span>
                            <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-bold badge-${f.severity}">${f.severity}</span>
                        </div>
                    </td>
                </tr>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function filterBySeverity() {
            const severity = document.getElementById('severity-filter').value;
            const status = document.getElementById('status-filter').value;
            filterFindings(severity, status);
        }

        function filterByStatus() {
            const severity = document.getElementById('severity-filter').value;
            const status = document.getElementById('status-filter').value;
            filterFindings(severity, status);
        }

        function filterFindings(severity, status) {
            let all = [];
            if (currentProvider === 'all') {
                for (const [provider, findings] of Object.entries(allFindings)) {
                    findings.forEach(f => all.push(f));
                }
            } else if (allFindings[currentProvider]) {
                all = allFindings[currentProvider];
            }

            let filtered = all;
            if (severity !== 'all') {
                filtered = filtered.filter(f => f.severity === severity);
            }
            if (status !== 'all') {
                filtered = filtered.filter(f => f.status === status);
            }

            const list = document.getElementById('findings-list');
            if (filtered.length === 0) {
                list.innerHTML = `<tr><td colspan="5" class="px-5 py-8 text-center text-[13px] text-[#8b97a8]">Nenhum finding com este filtro</td></tr>`;
                return;
            }

            list.innerHTML = filtered.map(f => `
                <tr class="finding-row border-b border-[#edf1f5] transition-colors">
                    <td class="px-4 lg:px-5 py-3">
                        <span class="flex size-6 items-center justify-center rounded-full ${f.status === 'pass' ? 'bg-[#dcfce7] text-[#22c55e]' : 'bg-[#fee2e2] text-[#ef4444]'}">
                            <i data-lucide="${f.status === 'pass' ? 'check' : 'x'}" class="size-3"></i>
                        </span>
                    </td>
                    <td class="px-4 lg:px-5 py-3">
                        <p class="text-[12px] font-medium text-[#142033] truncate max-w-[250px]">${f.title}</p>
                        <p class="text-[10px] text-[#8b97a8]">${f.description ? f.description.substring(0, 60) : ''}...</p>
                    </td>
                    <td class="hidden sm:table-cell px-4 lg:px-5 py-3">
                        <span class="rounded-full bg-[#f1f5f9] px-2 py-0.5 text-[10px] font-medium text-[#475569]">${f.provider}</span>
                    </td>
                    <td class="hidden md:table-cell px-4 lg:px-5 py-3">
                        <span class="text-[11px] text-[#4b5563]">${f.service}</span>
                    </td>
                    <td class="px-4 lg:px-5 py-3">
                        <div class="flex items-center gap-2">
                            <span class="severity-dot ${f.severity}"></span>
                            <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-bold badge-${f.severity}">${f.severity}</span>
                        </div>
                    </td>
                </tr>
            `).join('');
            if (window.lucide) lucide.createIcons();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>

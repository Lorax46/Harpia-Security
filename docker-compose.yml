version: '3.8'

services:
  # ============================================================
  # API Gateway
  # ============================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: horus-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DATABASE_URL=postgres://${DB_USER:-horus}:${DB_PASSWORD:-horus}@postgres:5432/${DB_NAME:-horus}?sslmode=disable
      - REDIS_URL=redis:${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-horus}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: horus-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-horus}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-horus}
      - POSTGRES_DB=${DB_NAME:-horus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - horus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-horus} -d ${DB_NAME:-horus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: horus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-horus}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - horus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-horus}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: horus-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-horus}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-horus12345}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - horus-net
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: horus-clickhouse
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-horus}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-horus}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-horus}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9009}:9000"
    networks:
      - horus-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: horus-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-horus}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-horus}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - horus-net
    restart: unless-stopped

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: horus-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - API_URL=${API_URL:-http://localhost:8080}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      - gateway
    networks:
      - horus-net
    restart: unless-stopped

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  clickhouse-data:
    driver: local
  rabbitmq-data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  horus-net:
    driver: bridge

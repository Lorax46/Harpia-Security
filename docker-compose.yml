version: '3.8'

services:
  totvs-horus:
    build: .
    container_name: totvs-horus
    volumes:
      - ./configs:/app/configs:ro
      - ./output:/app/output
      - ./reports:/app/reports
      - ~/.aws:/root/.aws:ro
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.azure:/root/.azure:ro
      - ~/.oci:/root/.oci:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - OCI_TENANCY=${OCI_TENANCY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    networks:
      - totvs-horus-net

volumes:
  output:
  reports:

networks:
  totvs-horus-net:
    driver: bridge
